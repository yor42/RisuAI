         transform="matrix(0.13280815,0,0,0.13280815,68.936915,75.319963)"
         id="path5" />
    </mask>
  </defs>
  <rect
     x="0"
     y="0"
     width="512"
     height="512"
     rx="58"
     ry="58"
     style="fill:url(#rtTileGradient)"
     id="rect1" />
  <g
