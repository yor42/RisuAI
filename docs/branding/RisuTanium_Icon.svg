    <!-- Teal to periwinkle, sampled from upstream's app icon (public/logo_512.png). -->
    <linearGradient
       id="rtTileGradient"
       gradientUnits="userSpaceOnUse"
       x1="100"
       y1="40"
       x2="360"
       y2="470">
      <stop
         offset="0"
         style="stop-color:#00a1ad;stop-opacity:1"
         id="stop1" />
      <stop
         offset="1"
         style="stop-color:#587bff;stop-opacity:1"
         id="stop2" />
    </linearGradient>
    <!-- Cuts the innermost triangle out of the mark so the tile shows through it. -->
