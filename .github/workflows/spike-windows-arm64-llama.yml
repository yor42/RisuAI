name: 'SPIKE: Windows ARM64 llama-cpp-python build feasibility'
# Throwaway investigation workflow for Agents/Roadmap.md Phase 3 item 2
# (Windows on ARM). Not part of the release pipeline — manual dispatch only.
#
# Purpose: settle the one open question left after documentation-only
# research (see the Roadmap entry and the session that added this file):
# does `pip install llama-cpp-python` — invoked exactly the way
# src-tauri/src/main.rs's install_py_dependencies() invokes it, with no
# custom CMAKE_ARGS — successfully build llama.cpp's C++ source natively on
# a Windows ARM64 runner, using the SAME embeddable-Python setup the real
# app uses (including the python311._pth site-packages fix post_py_install()
# performs)? If this succeeds, Phase 3 item 2's remaining risk is
# essentially resolved. If it fails, the failure output tells us what
# CMAKE_ARGS or toolchain step needs to be added to install_py_dependencies()
# before this can ship for real.
#
# Delete this file once Phase 3 item 2 is either fully implemented (wired
# into github-actions-builder.yml's real release matrix) or abandoned —
# it exists purely to answer this one question, not as a permanent CI job.
#
# Round 1 result: the first version of this spike (a bare `pip install
# llama-cpp-python`, no CMAKE_ARGS) failed with "MSVC is not supported on
# ARM. use clang" — confirming the concern flagged when this file was first
# written: scikit-build-core's DEFAULT CMake invocation does not correctly
# auto-target ARM64 on this platform, it needs to be told explicitly to use
# Clang. This version fixes that by activating the ARM64 Native Tools
# environment and passing explicit CMAKE_ARGS matching llama.cpp's own
# documented arm64-windows-llvm-release preset.
#
# Round 2 note (caught before ever triggering this version — no wasted CI
# run): the runner label was originally `windows-11-arm`, based on research
# that turned out to have conflated two different images mid-migration.
# `windows-11-arm` does NOT include Visual Studio at all (confirmed against
# actions/runner-images' own current docs) — the Clang/LLVM component this
# spike needs only exists on the separate `windows-11-vs2026-arm` image.
# GitHub is actively migrating `windows-11-arm` itself to eventually point
# at that same VS2026 image (rollout began 2026-09-21, per GitHub's own
# changelog), but rather than depend on exactly where that gradual rollout
# currently stands on any given day, this explicitly targets
# `windows-11-vs2026-arm` — the label GitHub's own changelog documents as
# the deliberate way to get the VS2026+Clang image regardless of migration
# timing. Whether THIS version succeeds is still unknown as of this
# comment — that's what triggering it will tell us.
# Separately, and importantly: even if this now builds cleanly in CI, that
# only proves llama.cpp CAN be compiled for Windows ARM64 given a full
# Visual Studio + Clang/LLVM install — a real end user's Windows-on-ARM
# machine almost certainly won't have that installed. Getting this to work
# for real users (not just this CI runner) is a separate, likely larger,
# product-level question this spike does not attempt to answer.
on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: windows-11-vs2026-arm
    steps:
      - name: Show environment
        shell: pwsh
        run: |
          [System.Environment]::Is64BitOperatingSystem
          $env:PROCESSOR_ARCHITECTURE
          Get-CimInstance Win32_Processor | Select-Object Name, Architecture

      - name: Download and extract the ARM64 embeddable Python (same version/URL install_python() uses)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.7/python-3.11.7-embed-arm64.zip" -OutFile "python.zip"
          Expand-Archive -Path "python.zip" -DestinationPath "python" -Force
          .\python\python.exe --version

      - name: Enable site-packages (mirrors post_py_install()'s python311._pth fix)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pthPath = "python\python311._pth"
          (Get-Content $pthPath) -replace '#import site', 'import site' | Set-Content $pthPath
          Get-Content $pthPath

      - name: Bootstrap pip (mirrors install_pip())
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "get-pip.py"
          .\python\python.exe get-pip.py
          .\python\python.exe -m pip --version

      - name: Install dependencies preceding llama-cpp-python (same order local.ts's installPython() uses)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Everything up to (not including) llama-cpp-python in local.ts's
          # dependency list — these are pure-Python/already-wheeled packages
          # on every platform, no special compiler needed for them.
          $deps = @(
            'pydantic',
            'scikit-build',
            'scikit-build-core',
            'pyproject_metadata',
            'pathspec'
          )
          foreach ($dep in $deps) {
            Write-Host "=== Installing $dep ==="
            .\python\python.exe -m pip install --verbose $dep
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::pip install failed for $dep"
              exit 1
            }
          }

      - name: Activate the ARM64 Native Tools environment (PATH/INCLUDE/LIB) for subsequent steps
        shell: pwsh
        run: |
          # Real end-user machines almost certainly won't have Visual Studio
          # installed at all — this step only exists to let THIS spike answer
          # "can llama.cpp's C++ source be compiled for Windows ARM64 at
          # all," using the toolchain the windows-11-vs2026-arm runner ships
          # (confirmed present: Microsoft.VisualStudio.Component.VC.Llvm.Clang).
          # It does NOT answer "how would a real user's machine get this
          # toolchain" — that's a separate, likely harder, product-level
          # question to resolve only if this spike confirms the build itself
          # is even possible.
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            Write-Host "::error::vswhere.exe not found — cannot locate a Visual Studio installation."
            exit 1
          }
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Llvm.Clang -property installationPath
          if (-not $vsPath) {
            Write-Host "::error::No Visual Studio installation with the VC.Llvm.Clang component was found on this runner."
            exit 1
          }
          Write-Host "Using Visual Studio at: $vsPath"
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsall)) {
            Write-Host "::error::vcvarsall.bat not found at expected path: $vcvarsall"
            exit 1
          }
          # `arm64` (single argument, not `x64_arm64` or similar) selects the
          # NATIVE arm64 host+target toolset — this runner's own CPU is
          # arm64, so this is not a cross-compile.
          $envDump = cmd.exe /c "`"$vcvarsall`" arm64 && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::vcvarsall.bat arm64 exited non-zero — see output above for the actual error."
            $envDump
            exit 1
          }
          $foundClang = $false
          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              $value = $matches[2]
              if ($name -ieq 'PATH') {
                # Prepended (not replacing the runner's existing PATH) via
                # GITHUB_PATH, one entry per line — this is what actually
                # makes clang.exe/clang++.exe resolvable in later steps.
                ($value -split ';') | Where-Object { $_ -ne '' } | Add-Content -Path $env:GITHUB_PATH
              } else {
                # INCLUDE/LIB/LIBPATH/VSCMD_* etc. — persisted for later
                # steps via GITHUB_ENV, GitHub Actions' standard mechanism.
                Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              }
              if ($name -ieq 'PATH' -and $value -match 'Llvm') {
                $foundClang = $true
              }
            }
          }
          if (-not $foundClang) {
            Write-Host "::warning::vcvarsall.bat arm64 ran, but no 'Llvm' path segment was seen — clang may not actually be on PATH for the next step. Continuing anyway; the next step's own clang --version check will catch this for real."
          }

      - name: Confirm clang is actually resolvable and targets arm64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $clang = Get-Command clang -ErrorAction SilentlyContinue
          if (-not $clang) {
            Write-Host "::error::clang.exe is not on PATH after activating the ARM64 Native Tools environment — the vcvarsall step above did not actually expose it."
            exit 1
          }
          Write-Host "clang resolved to: $($clang.Source)"
          clang --version

      - name: Install llama-cpp-python with an explicit ARM64/Clang toolchain (matching llama.cpp's own arm64-windows-llvm-release preset)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Mirrors https://github.com/ggml-org/llama.cpp/blob/master/cmake/arm64-windows-llvm.cmake
          # (the toolchain file llama.cpp's own documented ARM64 Windows
          # build preset uses) as directly-passed CMake cache variables,
          # rather than depending on that file's path inside whatever
          # temporary build directory scikit-build-core creates — plain
          # `clang`/`clang++` (the GNU-style driver), NOT `clang-cl`, each
          # explicitly targeting arm64-pc-windows-msvc. Deliberately omits
          # that file's -march/-fvectorize/etc. optimization flags for this
          # first pass — this step is checking "does it build and import at
          # all," not "is it fully tuned yet."
          $env:CMAKE_ARGS = "-G Ninja -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_SYSTEM_PROCESSOR=arm64 -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_C_COMPILER_TARGET=arm64-pc-windows-msvc -DCMAKE_CXX_COMPILER_TARGET=arm64-pc-windows-msvc"
          Write-Host "CMAKE_ARGS = $env:CMAKE_ARGS"
          .\python\python.exe -m pip install --verbose llama-cpp-python
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::pip install failed for llama-cpp-python even with an explicit Clang/ARM64 toolchain — see the verbose CMake/build output above for the actual error."
            exit 1
          }

      - name: Install remaining dependencies (same order local.ts's installPython() uses)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deps = @(
            'uvicorn[standard]',
            'fastapi'
          )
          foreach ($dep in $deps) {
            Write-Host "=== Installing $dep ==="
            .\python\python.exe -m pip install --verbose $dep
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::pip install failed for $dep"
              exit 1
            }
          }

      - name: Verify llama_cpp actually imports and reports a native (not emulated) build
        shell: pwsh
        run: |
          # $ErrorActionPreference only governs PowerShell/cmdlet errors — a
          # native .exe returning a nonzero exit code does NOT stop the
          # script or fail the step on its own, so each command below is
          # checked explicitly via $LASTEXITCODE. Without this, a failed
          # import on the first line would silently fall through to the
          # second line, which could still succeed and exit 0 — making the
          # whole step (and therefore this spike) report a false "pass"
          # even though llama_cpp never actually built/imported correctly.
          $ErrorActionPreference = "Stop"

          .\python\python.exe -c "from llama_cpp import Llama; print('llama_cpp imported OK')"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::llama_cpp failed to import — the build did not succeed."
            exit 1
          }

          $reportedArch = (.\python\python.exe -c "import platform; print(platform.machine())").Trim()
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Failed to query platform.machine() after a successful import."
            exit 1
          }
          Write-Host "python reports arch: $reportedArch"
          if ($reportedArch -ne "ARM64") {
            Write-Host "::error::Expected a native ARM64 interpreter (platform.machine() == 'ARM64'), got '$reportedArch' — this build may be running under x64 emulation instead of natively, which defeats the purpose of this spike."
            exit 1
          }
