name: PR Check

# The fork's CI: type check, unit tests and a production build.
# Push runs skip changes that only touch docs or agent notes.
on:
  push:
    paths-ignore:
      - 'wiki/**'
      - 'Agents/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # package.json engines allows node ^20.19.0 || >=22.12.0; the Dockerfile and the release
      # workflow build with 24.
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The pnpm version comes from the packageManager field in package.json.
      - name: install pnpm
        uses: pnpm/action-setup@v5

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run svelte-check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
